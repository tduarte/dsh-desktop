# electron-builder configuration for macOS and Windows.
#
# Linux uses `flatpak-builder` (see flatpak/ai.deepseek.harness.desktop.yml);
# this file's linux section is intentionally absent — CI runs electron-builder
# --linux --x64 separately to produce the archive flatpak-builder consumes
# via `extra-data`.
#
# Code signing / notarization is deferred. macOS: users right-click → Open.
# Windows: SmartScreen warns. Both land in a follow-up PR.

appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 DeepSeek
asar: true
# Disable electron-builder's nodeModuleCollector; it walks the entire
# `node_modules/` tree at build time to assemble a production-only
# dependency graph, and OOMs on CI runners where ~865 packages x native
# binaries pushes the V8 heap past the 8 GB default. Our package.json
# already declares a minimal runtime closure via dependencies; ASAR
# bundles everything in `files` as-is and we ship extraResources/dsh/
# (the entire staged tree) outside the asar. Concretely: zero benefit
# from running the collector, real cost in cold-cache + cold-node.
nodeModuleCollector: false
directories:
  output: dist
  buildResources: build
files:
  - lib/**/*
  - package.json
  - "!**/*.map"
  - "!**/{.git,.DS_Store,.idea,.vscode,test,tests,coverage,docs}/**"
extraResources:
  - from: build/stage/dsh
    to: dsh
  - from: build/stage/dist
    to: dist
extraMetadata:
  main: lib/main.cjs
  version: ${package.version}
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: tduarte
  repo: dsh-desktop
  releaseType: release