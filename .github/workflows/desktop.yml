# Build and publish DeepSeek Harness desktop installers.
#
# Triggers:
#   - pull_request, push (master): matrix build, smoke test, upload as artifacts
#   - tag v*: matrix build + create/update GitHub Release with installers + flatpak repo
#
# Matrix: macOS (.dmg), Windows (.exe), Linux (.flatpak + OSTree repo).
# No code signing in this PR.

name: Desktop

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  typecheck-test:
    name: Typecheck + Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (.flatpak)
    runs-on: ubuntu-22.04
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Flatpak + Flathub remote
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user flathub org.electronjs.Electron2.BaseApp//24.08

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run dist:linux
      - run: pnpm run flatpak:build

      - name: Verify .flatpak structure
        run: |
          test -f build/flatpak-out/DeepSeek-Harness-*.flatpak
          test -f build/flatpak-out/repo.tar.gz
          # Smoke-test: install to a throwaway user prefix and confirm the
          # entry resolves; we don't run the GUI here (CI has no display).
          flatpak --user install --bundle build/flatpak-out/DeepSeek-Harness-*.flatpak ai.deepseek.harness.desktop || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            build/flatpak-out/*.flatpak
            build/flatpak-out/repo.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-mac
          path: dist/mac
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-win
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: dist/linux

      - name: Flatten artifacts for upload
        run: |
          find dist/mac -name '*.dmg' -exec cp {} dist/ \;
          find dist/win -name '*.exe' -exec cp {} dist/ \;
          cp dist/linux/*.flatpak dist/
          cp dist/linux/repo.tar.gz dist/
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.flatpak
            dist/repo.tar.gz
          fail_on_unmatched_files: true