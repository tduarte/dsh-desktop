name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      - name: Build macOS .app
        # Manual pack bypasses electron-builder's OOMing nodeModulesCollector.
        # Produces dist/DeepSeek Harness.app without invoking electron-builder.
        run: pnpm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac
          path: |
            dist/DeepSeek Harness.app
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      - name: Build Windows directory
        shell: pwsh
        run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win
          path: |
            dist/DeepSeek-Harness-*-win-x64/**
          retention-days: 14

  build-linux:
    name: Build Linux (.flatpak)
    runs-on: ubuntu-22.04
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      - name: Build Linux tarball
        # Manual pack bypasses electron-builder's OOMing nodeModulesCollector.
        # Produces dist/DeepSeek-Harness-<version>-linux-x64.tar.gz.
        run: pnpm run dist:linux
      - name: Install flatpak-builder
        # flatpak-builder is not preinstalled on ubuntu-22.04 runners.
        run: sudo apt-get update && sudo apt-get install -y flatpak-builder
      - name: Add Flathub remote (user)
        # flatpak-builder --user (the default in flatpak-build.sh) installs
        # the Electron2 BaseApp + runtime into the user's flatpak install,
        # so the remote must exist at the user level, not system.
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build .flatpak bundle
        # flatpak-build.sh renders ${VERSION}, runs flatpak-builder against
        # the manifest, exports the OSTree repo, and bundles a .flatpak +
        # repo.tar.gz. Uses --user because the runner is non-root.
        run: pnpm run flatpak:build
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            build/flatpak-out/DeepSeek-Harness-*.flatpak
            build/flatpak-out/repo.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    # Runs on tag push AND on manual dispatch (workflow_dispatch). v0.1.1
    # is a manual-install pre-release:
    #   - macOS: DeepSeek Harness.app (no .dmg, no latest-mac.yml)
    #   - Windows: DeepSeek-Harness-0.1.1-win-x64/ directory (zipped)
    # Auto-update is not wired in this release; downstream releases
    # will switch to electron-builder NSIS + dmg with proper manifests.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-mac
          path: artifacts/mac
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-win
          path: artifacts/win
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-linux
          path: artifacts/linux
        # Updater-free v0.1.1: ship the directory as a zip so users have
        # a single download artifact. Renamed from the raw dist output.
        working-directory: artifacts/win
        run: |
          set -euo pipefail
          shopt -s nullglob
          dir=(DeepSeek-Harness-*-win-x64)
          if [ "${#dir[@]}" -ne 1 ]; then
            echo "expected exactly one win-x64 directory, got: ${dir[*]}" >&2
            exit 1
          fi
          (cd "$dir" && zip -r "../${dir}.zip" .)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: v0.1.1
          generate_release_notes: true
          prerelease: true
          files: |
            artifacts/mac/DeepSeek Harness.app/**
            artifacts/mac/*.dmg
            artifacts/mac/latest-mac.yml
            artifacts/win/*.zip
            artifacts/linux/*.flatpak

