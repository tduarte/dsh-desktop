name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

env:
  NODE_VERSION: '22'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      - name: Build macOS .app
        # Manual pack bypasses electron-builder's OOMing nodeModulesCollector.
        # Produces dist/DeepSeek Harness.app without invoking electron-builder.
        run: pnpm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac
          path: |
            dist/DeepSeek Harness.app
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      - name: Build Windows directory
        shell: pwsh
        run: pnpm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win
          path: |
            dist/DeepSeek-Harness-*-win-x64/**
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux (.flatpak)
    runs-on: ubuntu-22.04
    needs: typecheck-test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Flatpak + Flathub remote
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user -y install flathub org.electronjs.Electron2.BaseApp//24.08

      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # electron's package.json exposes no install script — pnpm 10 won't
        # auto-invoke it. We must run install.js ourselves to download the
        # platform binary into node_modules/electron/dist/.
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - run: pnpm run icon:build
      # Manual pack bypasses electron-builder's OOMing nodeModulesCollector.
      # flatpak-builder consumes this tarball via `extra-data`.
      - run: pnpm run dist:linux
      - run: pnpm run flatpak:build

      - name: Verify .flatpak structure
        run: |
          test -f dist/DeepSeek-Harness-*-linux-x64.tar.gz
          test -f build/flatpak-out/DeepSeek-Harness-*.flatpak
          test -f build/flatpak-out/repo.tar.gz
          flatpak --user install --bundle build/flatpak-out/DeepSeek-Harness-*.flatpak ai.deepseek.harness.desktop || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            dist/DeepSeek-Harness-*-linux-x64.tar.gz
            build/flatpak-out/*.flatpak
            build/flatpak-out/repo.tar.gz
          if-no-files-found: error
          retention-days: 14