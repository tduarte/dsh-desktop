app-id: io.github.tduarte.dsh-desktop
# BaseApp provides the prebuilt Electron runtime + zypak sandbox, shared
# across every Electron flatpak on Flathub. We ship our own Electron app
# archive (built by pnpm run dist:linux) as extra-data; the wrapper uses
# zypak-wrapper.sh (inherited from the base at /app/bin) to launch it.
# https://docs.flatpak.org/en/latest/electron.html
#
# The Electron app tarball (build/pack-linux.mjs) is extracted at build time:
#   - Electron binary (node_modules/electron/dist/electron)
#   - compiled lib/main.cjs + lib/preload.cjs
#   - bundled @deepseek-ai/dsh CLI + Vite frontend in resources/
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: dsh-desktop

finish-args:
  # Display: Electron 28+ has working Wayland support; sample app keeps X11
  # as the default and lets users opt into Wayland per launch.
  # https://docs.flatpak.org/en/latest/electron.html#sandbox-permissions
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=session-bus
  - --share=network
  # Filesystem
  - --filesystem=home
  - --filesystem=xdg-run/dsh:create
  - --filesystem=xdg-config/dsh:create
  - --filesystem=/tmp:create
  # Environment
  - --env=DSH_HOME=xdg-data/dsh
  # Wayland HiDPI cursor scaling requires XCURSOR_PATH from host
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_TRASH=gio
  # Notifications + system tray
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # DBus name ownership
  - --own-name=io.github.tduarte.dsh-desktop

modules:
  # Desktop integration assets + Electron archive staging + launch wrapper.
  # The "build" is just `install -D` of prebuilt artifacts; nothing compiles.
  - name: dsh-desktop
    buildsystem: simple
    build-commands:
      # Desktop file, AppStream metadata, hicolor icons.
      # flatpak-builder flattens file sources into the build cwd using their
      # basename, so install -Dm644 <basename> /app/<path>/<basename>.
      - install -Dm644 io.github.tduarte.dsh-desktop.desktop /app/share/applications/io.github.tduarte.dsh-desktop.desktop
      - install -Dm644 io.github.tduarte.dsh-desktop.metainfo.xml /app/share/metainfo/io.github.tduarte.dsh-desktop.metainfo.xml
      - install -Dm644 icon-16.png /app/share/icons/hicolor/16x16/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-48.png /app/share/icons/hicolor/48x48/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.tduarte.dsh-desktop.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.tduarte.dsh-desktop.png
      # Extract the prebuilt Electron app tarball directly into the app
      # prefix. Bundles built with `flatpak build-bundle` ship the extracted
      # tree, so no extra-data/apply_extra round-trip is needed.
      - mkdir -p /app/dsh-desktop
      - tar -xzf DeepSeek-Harness-${VERSION}-linux-x64.tar.gz -C /app/dsh-desktop --strip-components=1
      # Launch wrapper.
      - install -Dm755 wrapper.sh /app/bin/dsh-desktop
    sources:
      - type: file
        path: io.github.tduarte.dsh-desktop.desktop
      - type: file
        path: io.github.tduarte.dsh-desktop.metainfo.xml
      - type: file
        path: ../build/icon-16.png
      - type: file
        path: ../build/icon-32.png
      - type: file
        path: ../build/icon-48.png
      - type: file
        path: ../build/icon-64.png
      - type: file
        path: ../build/icon-128.png
      - type: file
        path: ../build/icon-256.png
      - type: file
        path: ../build/icon-512.png
      - type: file
        path: ../dist/DeepSeek-Harness-${VERSION}-linux-x64.tar.gz
      - type: file
        path: wrapper.sh

build-options:
  cflags: -O2
  append-path: /usr/bin
